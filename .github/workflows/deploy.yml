name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Ahorro: segunda app del repositorio, publicada en /ahorro/ dentro de la misma web.
      - run: npm ci --prefix ahorro
      # Pruebas de Ahorro: si alguna falla, no se publica.
      - run: npm run test:db --prefix ahorro
      - run: npx playwright install --with-deps chromium
        working-directory: ahorro
      - run: npx playwright test
        working-directory: ahorro
        env:
          CI: "1"
      - run: npm run build --prefix ahorro
        env:
          # Opcional: si se definen estas variables del repositorio, la app guarda también en la nube (ver replica/backend.md).
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - run: cp -r ahorro/dist dist/ahorro
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
